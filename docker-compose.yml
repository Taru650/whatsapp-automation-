# Saran Citizen WhatsApp Bot - production/staging stack.
#
#   office machine (default):  docker compose --profile tunnel up -d
#   VPS fallback (plan §2.4):   docker compose --profile vps up -d
#   staging next to prod:       docker compose -p bot-staging --env-file .env.staging --profile tunnel up -d
#   more capacity (queue mode): EXECUTIONS_MODE=queue in .env, then
#                               docker compose --profile tunnel --profile scale up -d --scale n8n-worker=3
#
# First deploy and every update:
#   docker compose run --rm migrate          # apply sql/*.sql (idempotent)
#   docker compose stop n8n && docker compose run --rm import && docker compose up -d n8n
#
# Only Caddy is reachable from outside, and it forwards nothing but the webhook
# paths. The n8n editor, Postgres and Metabase stay on 127.0.0.1 (reach them over Tailscale).

x-n8n-env: &n8n-env
  # n8n's own storage
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-bot}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env (and back it up)}
  N8N_HOST: ${PUBLIC_HOST:-localhost}
  N8N_PROTOCOL: https
  WEBHOOK_URL: https://${PUBLIC_HOST:-localhost}/
  N8N_LISTEN_ADDRESS: 0.0.0.0
  GENERIC_TIMEZONE: Asia/Kolkata
  TZ: Asia/Kolkata
  # workflows read their configuration from $env
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  NODE_FUNCTION_ALLOW_BUILTIN: crypto
  # our message_log is the audit trail; don't keep successful executions
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "72"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_RUNNERS_TASK_TIMEOUT: "60"
  # Bound concurrent executions so a traffic spike queues instead of thrashing
  # (load test: no loss/duplicates at 2x capacity, self-recovers).
  N8N_CONCURRENCY_PRODUCTION_LIMIT: ${N8N_CONCURRENCY_PRODUCTION_LIMIT:-10}
  # Queue mode (profile "scale"): main takes webhooks, workers execute.
  EXECUTIONS_MODE: ${EXECUTIONS_MODE:-regular}
  QUEUE_BULL_REDIS_HOST: redis
  # bot configuration (see .env.example)
  ENV: ${ENV:-prod}
  META_APP_SECRET: ${META_APP_SECRET:?set META_APP_SECRET}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?set WHATSAPP_VERIFY_TOKEN}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?set WHATSAPP_PHONE_NUMBER_ID}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:?set WHATSAPP_ACCESS_TOKEN}
  GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v23.0}
  WA_API_BASE: ${WA_API_BASE:-https://graph.facebook.com}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  LLM_ENABLED: ${LLM_ENABLED:-true}
  LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
  PHONE_HASH_SECRET: ${PHONE_HASH_SECRET:?set PHONE_HASH_SECRET}
  # daily report e-mail (optional; WhatsApp admin_alert is always sent)
  SMTP_HOST: ${SMTP_HOST:-}
  REPORT_EMAIL_TO: ${REPORT_EMAIL_TO:-}
  REPORT_EMAIL_FROM: ${REPORT_EMAIL_FROM:-}
  PGCRYPTO_KEY: ${PGCRYPTO_KEY:?set PGCRYPTO_KEY}
  ADMIN_WA_NUMBERS: ${ADMIN_WA_NUMBERS:-}
  ADMIN_ALERT_TEMPLATE: ${ADMIN_ALERT_TEMPLATE:-admin_alert}
  # Sonpur Mela data (Google Sheet read by the sync-mela workflow)
  MELA_SHEET_ID: ${MELA_SHEET_ID:-}
  GOOGLE_SA_JSON: ${GOOGLE_SA_JSON:-}

services:
  postgres:
    image: postgres:16.13
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: citizen_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d citizen_bot"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.40.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"

  # Queue mode (optional): Redis + N workers. Measured +30-40% on 4 shared cores;
  # scales further with more cores. Needs EXECUTIONS_MODE=queue in .env.
  redis:
    image: redis:7.4
    profiles: ["scale"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  n8n-worker:
    image: n8nio/n8n:2.40.5
    profiles: ["scale"]
    restart: unless-stopped
    command: worker --concurrency=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: *n8n-env

  # Path filter in front of n8n: only the webhook + health endpoints are forwarded.
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

  # Analytics (M3): Metabase on 127.0.0.1:3000 (reach it over Tailscale). Its own
  # settings live in the "metabase" database; it reads citizen_bot only as the
  # read-only metabase_ro user, which sees nothing but the analytics schema.
  #   docker compose --profile analytics up -d metabase
  #   docker compose run --rm metabase-setup        # dashboard (idempotent)
  metabase:
    image: metabase/metabase:v0.63.18.2
    profiles: ["analytics"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER:-bot}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_SITE_LOCALE: en
      JAVA_TIMEZONE: Asia/Kolkata
      JAVA_OPTS: -Xmx1g
    ports:
      - "127.0.0.1:${METABASE_HOST_PORT:-3000}:3000"

  # Office machine: outbound-only Cloudflare Tunnel -> caddy (no inbound ports, no static IP).
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [caddy]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-missing-token}

  # VPS fallback: Caddy with automatic Let's Encrypt TLS on the public IP.
  caddy-public:
    image: caddy:2.10
    profiles: ["vps"]
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      SITE_ADDRESS: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  # One-shot jobs
  migrate:
    image: postgres:16.13
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes: [".:/app:ro"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-bot}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: citizen_bot
      ADMIN_WA_NUMBERS: ${ADMIN_WA_NUMBERS:-}
      PHONE_HASH_SECRET: ${PHONE_HASH_SECRET}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:-}
    entrypoint: ["bash", "scripts/db_migrate.sh"]

  metabase-setup:
    image: python:3.12-slim
    profiles: ["jobs"]
    working_dir: /app
    volumes: [".:/app:ro"]
    environment:
      METABASE_URL: http://metabase:3000
      MB_ADMIN_EMAIL: ${MB_ADMIN_EMAIL:?set MB_ADMIN_EMAIL}
      MB_ADMIN_PASSWORD: ${MB_ADMIN_PASSWORD:?set MB_ADMIN_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?set METABASE_DB_PASSWORD}
    entrypoint: ["python3", "scripts/metabase_setup.py", "--verify"]

  import:
    image: n8nio/n8n:2.40.5
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes: [".:/app:ro", "n8n_data:/home/node/.n8n"]
    environment:
      <<: *n8n-env
      N8N_BIN: n8n
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: citizen_bot
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    entrypoint: ["sh", "scripts/n8n_import.sh"]

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
